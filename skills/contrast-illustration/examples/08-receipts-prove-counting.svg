<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="600" y="72" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1a1a1a">Receipts prove counting, not choice</text>

  <!-- left scene: rejected -->
  <rect x="40" y="120" width="540" height="440" rx="18" fill="#fff5f5" stroke="#d32f2f" stroke-width="5" stroke-dasharray="18 12"/>
  <circle cx="80" cy="160" r="24" fill="#d32f2f"/>
  <text x="80" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">✕</text>
  <!-- artifact: phone card -->
  <rect x="70" y="205" width="480" height="135" rx="16" fill="#ffffff" stroke="#9e9e9e" stroke-width="2"/>
  <text x="96" y="248" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#757575">Your vote</text>
  <rect x="96" y="268" width="34" height="34" rx="6" fill="#c62828"/>
  <path d="M104 285 l7 7 l13 -15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="146" y="297" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1a1a1a">Party B</text>
  <!-- tech line -->
  <rect x="70" y="370" width="480" height="52" rx="8" fill="#1e1e1e"/>
  <text x="88" y="404" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#e6e6e6">GET /ballot/7f3a?show=choice</text>
  <text x="310" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#c62828">Vote sellable</text>

  <!-- right scene: chosen -->
  <rect x="620" y="120" width="540" height="440" rx="18" fill="#f3faf3" stroke="#2e7d32" stroke-width="5"/>
  <circle cx="660" cy="160" r="24" fill="#2e7d32"/>
  <text x="660" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">✓</text>
  <rect x="650" y="205" width="480" height="135" rx="16" fill="#ffffff" stroke="#9e9e9e" stroke-width="2"/>
  <text x="676" y="248" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#757575">Your vote</text>
  <text x="676" y="297" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#1a1a1a">7F3A-92C1</text>
  <text x="1104" y="297" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2e7d32">Counted</text>
  <rect x="650" y="370" width="480" height="52" rx="8" fill="#1e1e1e"/>
  <text x="668" y="404" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#e6e6e6">GET /verify?receipt=7F3A-92C1</text>
  <text x="890" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#2e7d32">Choice stays secret</text>
</svg>
