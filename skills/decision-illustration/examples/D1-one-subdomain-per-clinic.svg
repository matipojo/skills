<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="600" y="72" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1a1a1a">One subdomain per clinic</text>

  <!-- left scene: rejected -->
  <rect x="40" y="120" width="540" height="440" rx="18" fill="#fff5f5" stroke="#d32f2f" stroke-width="5" stroke-dasharray="18 12"/>
  <circle cx="80" cy="160" r="24" fill="#d32f2f"/>
  <text x="80" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">✕</text>
  <!-- artifact: browser bar -->
  <rect x="70" y="210" width="480" height="120" rx="12" fill="#ffffff" stroke="#9e9e9e" stroke-width="2"/>
  <circle cx="96" cy="236" r="7" fill="#ef5350"/><circle cx="118" cy="236" r="7" fill="#ffca28"/><circle cx="140" cy="236" r="7" fill="#66bb6a"/>
  <rect x="88" y="262" width="444" height="50" rx="25" fill="#f1f1f1"/>
  <text x="112" y="296" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#333">app.com<tspan font-weight="700" fill="#c62828">/t/sunrise</tspan></text>
  <!-- tech line -->
  <rect x="70" y="370" width="480" height="52" rx="8" fill="#1e1e1e"/>
  <text x="88" y="404" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#e6e6e6">Set-Cookie: sid=9f2; Path=/</text>
  <!-- label -->
  <text x="310" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#c62828">Cookie shared</text>

  <!-- right scene: chosen -->
  <rect x="620" y="120" width="540" height="440" rx="18" fill="#f3faf3" stroke="#2e7d32" stroke-width="5"/>
  <circle cx="660" cy="160" r="24" fill="#2e7d32"/>
  <text x="660" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">✓</text>
  <rect x="650" y="210" width="480" height="120" rx="12" fill="#ffffff" stroke="#9e9e9e" stroke-width="2"/>
  <circle cx="676" cy="236" r="7" fill="#ef5350"/><circle cx="698" cy="236" r="7" fill="#ffca28"/><circle cx="720" cy="236" r="7" fill="#66bb6a"/>
  <rect x="668" y="262" width="444" height="50" rx="25" fill="#f1f1f1"/>
  <text x="692" y="296" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#333"><tspan font-weight="700" fill="#2e7d32">sunrise.</tspan>app.com</text>
  <rect x="650" y="370" width="480" height="52" rx="8" fill="#1e1e1e"/>
  <text x="668" y="404" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#e6e6e6">Set-Cookie: __Host-sid=9f2; Path=/</text>
  <text x="890" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#2e7d32">Cookie isolated</text>
</svg>
